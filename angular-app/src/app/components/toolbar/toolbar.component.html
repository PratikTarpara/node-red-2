<header class="toolbar" role="banner">
  <!-- Brand -->
  <div class="toolbar__brand">
    <div class="toolbar__logo" aria-hidden="true">⬡</div>
    <div class="toolbar__title-group">
      <span class="toolbar__title">AAS FlowBuilder</span>
      <span class="toolbar__subtitle">INDUSTRY 4.0 PLATFORM</span>
    </div>
  </div>

  <div class="toolbar__divider" role="separator"></div>

  <!-- Actions -->
  <div class="toolbar__actions" role="toolbar" aria-label="Flow actions">
    <button
      id="run-flow-btn"
      class="btn btn--run"
      (click)="onRun()"
      [disabled]="(state.isRunning$ | async) || (state.nodes$ | async)?.length === 0"
      [class.btn--running]="state.isRunning$ | async"
      [attr.aria-busy]="state.isRunning$ | async"
      aria-label="Run flow"
    >
      <!-- Play icon -->
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>{{ (state.isRunning$ | async) ? 'Running…' : 'Run Flow' }}</span>
    </button>

    <button
      id="save-flow-btn"
      class="btn btn--default"
      (click)="onSave()"
      aria-label="Save flow"
    >
      <!-- Save icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      <span>Save</span>
    </button>

    <button
      id="load-flow-btn"
      class="btn btn--default"
      (click)="onLoad()"
      aria-label="Load flow"
    >
      <!-- FolderOpen icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Load</span>
    </button>

    <button
      id="clear-flow-btn"
      class="btn btn--danger"
      (click)="onClear()"
      aria-label="Clear flow"
    >
      <!-- Trash icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
      </svg>
      <span>Clear</span>
    </button>
  </div>

  <div class="toolbar__spacer"></div>

  <!-- Stats -->
  <div class="toolbar__stats" aria-label="Flow statistics">
    <span>
      <strong>{{ (state.nodes$ | async)?.length }}</strong> nodes
    </span>
    <span>
      <strong>{{ (state.edges$ | async)?.length }}</strong> edges
    </span>
  </div>

  <div class="toolbar__divider" role="separator"></div>

  <!-- Console toggle -->
  <button
    id="toggle-console-btn"
    class="btn btn--default"
    (click)="onToggleConsole()"
    aria-label="Toggle debug console"
  >
    <!-- Terminal icon -->
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
    <span>Console</span>
  </button>
</header>
